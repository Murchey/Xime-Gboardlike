# Rime schema
# encoding: utf-8
# 拼音18键 · ABCDE 排列（组键按字母表顺序两两合并，与水杉输入法 msime 的 14/18 键同构）
#
# 组键：AB CD EF G H I J KL MN OP Q R S TU VW X Y Z
# 点合并键送组码（组内首字母）：aceghijkmoqrstvxyz
schema:
  schema_id: pinyin_18jian_abcde
  name: 拼音18键 ABCDE
  version: "1.0"
  description: |
    全拼 18 键，字母表顺序排列：18 个字母键，组内字母共用一个键，按组码解码。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: aceghijkmoqrstvxyz
  initials: aceghijkmoqrstvxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 组键映射：组内字母 → 组码
    - derive/[ab]/a/
    - derive/[cd]/c/
    - derive/[ef]/e/
    - derive/[kl]/k/
    - derive/[mn]/m/
    - derive/[op]/o/
    - derive/[tu]/t/
    - derive/[vw]/v/

translator:
  dictionary: pinyin_simp
  prism: pinyin_18jian_abcde
  spelling_hints: 100
  always_show_comments: true
  comment_format: []
  preedit_format:
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

punctuator:
  import_preset: default

recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"

key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }

editor:
  bindings:
    space: confirm
