# Rime schema
# encoding: utf-8
# 拼音14键（全拼的合并键变体，与水杉输入法 msime、本仓库 xime.yaml 的 qwerty_14 对应）
#
# 组键：QW ER TY UI OP AS DF GH JK L ZX CV BN M
# 点合并键送的是**组内首字母**（组码 qetuoadgjlzcbm）：
# 下面的 derive 规则把组内每个字母都映射成组码，字典里的音节因此有了一份组码拼写，
# 用户按组码输入即可命中（歧义由 rime 自己展开成多个音节候选）。
schema:
  schema_id: pinyin_14jian
  name: 拼音14键
  version: "1.0"
  description: |
    全拼 14 键：14 个字母键，组内字母共用一个键，按组码解码。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: abcdegjlmoqtuz
  initials: abcdegjlmoqtuz
  delimiter: " '"
  algebra:
    # 简拼规则（与全拼/九键一致）
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 拼音容错规则
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 组键映射：组内字母 → 组码
    - derive/[qw]/q/
    - derive/[er]/e/
    - derive/[ty]/t/
    - derive/[iu]/u/
    - derive/[op]/o/
    - derive/[as]/a/
    - derive/[df]/d/
    - derive/[gh]/g/
    - derive/[jk]/j/
    - derive/[xz]/z/
    - derive/[cv]/c/
    - derive/[bn]/b/

translator:
  dictionary: pinyin_simp
  prism: pinyin_14jian
  spelling_hints: 100
  always_show_comments: false
  comment_format: []
  preedit_format:
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

punctuator:
  import_preset: default

recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"

key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }

editor:
  bindings:
    space: confirm
